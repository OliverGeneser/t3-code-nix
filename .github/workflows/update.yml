name: Update T3 Code versions

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-t3code
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Update versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/update.sh

      - name: Validate flake
        run: nix flake check --all-systems --no-build

      - name: Build updated packages
        run: |
          nix build .#latest --print-build-logs
          nix build .#nightly --print-build-logs

      - name: Commit update
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: update T3 Code versions"
          file_pattern: versions.json
